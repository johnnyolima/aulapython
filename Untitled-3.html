<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação de Nadador</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #00b4d8, #90e0ef);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #0077b6;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #023e8a;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      color: #03045e;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Classificação de Nadador 🏊</h1>
    <label for="idade">Informe a idade:</label>
    <input type="number" id="idade" min="1" placeholder="Ex: 12">
    <button onclick="classificar()">Classificar</button>
    <div id="resultado"></div>
  </div>

  <script>
    function classificar() {
      const idade = parseInt(document.getElementById("idade").value);
      let categoria = "";

      if (isNaN(idade) || idade < 1) {
        categoria = "Por favor, insira uma idade válida.";
      } else if (idade >= 5 && idade <= 7) {
        categoria = "Infantil A";
      } else if (idade >= 8 && idade <= 10) {
        categoria = "Infantil B";
      } else if (idade >= 11 && idade <= 13) {
        categoria = "Juvenil A";
      } else if (idade >= 14 && idade <= 17) {
        categoria = "Juvenil B";
      } else if (idade >= 18) {
        categoria = "Adulto";
      } else {
        categoria = "Sem categoria disponível para essa idade.";
      }

      document.getElementById("resultado").textContent = `Categoria: ${categoria}`;
    }
  </script>
</body>
</html>
